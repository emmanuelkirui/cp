name: Mirror CPS Site

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install puppeteer

      - name: Crawl and mirror /cps/ directory
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const path = require('path');
          const { URL } = require('url');

          const BASE_URL = 'https://creativepulse.42web.io/cps/';
          const OUT_DIR = './cps';
          const visited = new Set();
          const queue = [BASE_URL];

          function urlToFilePath(url) {
            const u = new URL(url);
            let p = u.pathname.replace(/^\/cps/, '');
            if (!p || p.endsWith('/')) p += 'index.html';
            if (!path.extname(p)) p += '.html';
            return path.join(OUT_DIR, p);
          }

          function ensureDir(filePath) {
            const dir = path.dirname(filePath);
            fs.mkdirSync(dir, { recursive: true });
          }

          async function inlineAssets(page) {
            // Inline all external CSS and woff2 fonts
            await page.evaluate(async () => {
              const links = Array.from(document.querySelectorAll('link[rel=\"stylesheet\"]'));
              for (const link of links) {
                try {
                  const resp = await fetch(link.href, { mode: 'cors' });
                  if (!resp.ok) throw new Error('HTTP ' + resp.status);
                  let css = await resp.text();
                  const fontUrls = [...css.matchAll(/url\(['\"]?(https?:\/\/[^'\")]+\.woff2[^'\")]*)['\"]?\)/g)].map(m => m[1]);
                  for (const fontUrl of fontUrls) {
                    try {
                      const fr = await fetch(fontUrl);
                      const buf = await fr.arrayBuffer();
                      const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
                      css = css.replace(fontUrl, 'data:font/woff2;base64,' + b64);
                    } catch(fe) {
                      console.warn('Could not inline font:', fontUrl);
                    }
                  }
                  const style = document.createElement('style');
                  style.textContent = css;
                  link.parentNode.replaceChild(style, link);
                } catch(e) {
                  console.warn('Could not inline stylesheet:', link.href, e.message);
                }
              }
            });
          }

          async function rewriteLinks(page, currentUrl) {
            // Rewrite all relative URLs to absolute, keep /cps/ internal links relative
            await page.evaluate((baseUrl) => {
              const base = 'https://creativepulse.42web.io/cps/';
              document.querySelectorAll('[src],[href],[action]').forEach(el => {
                ['src','href','action'].forEach(attr => {
                  const val = el.getAttribute(attr);
                  if (!val) return;
                  if (val.startsWith('http') || val.startsWith('//') || val.startsWith('#') ||
                      val.startsWith('mailto:') || val.startsWith('tel:') || val.startsWith('data:') ||
                      val.startsWith('javascript:')) return;
                  el.setAttribute(attr, base + val);
                });
              });
            }, currentUrl);
          }

          async function collectLinks(page) {
            // Find all internal /cps/ links on the page
            return await page.evaluate(() => {
              return Array.from(document.querySelectorAll('a[href]'))
                .map(a => a.href)
                .filter(href => href.startsWith('https://creativepulse.42web.io/cps/'));
            });
          }

          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            fs.mkdirSync(OUT_DIR, { recursive: true });

            while (queue.length > 0) {
              const url = queue.shift();
              if (visited.has(url)) continue;
              visited.add(url);

              console.log('Processing:', url);

              const page = await browser.newPage();
              await page.setViewport({ width: 1280, height: 800 });
              await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36');
              await page.setExtraHTTPHeaders({
                'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
                'Accept-Language': 'en-US,en;q=0.9',
                'Cache-Control': 'no-cache',
              });

              try {
                await page.goto(url, { waitUntil: 'networkidle2', timeout: 60000 });
                await page.evaluate(() => document.fonts.ready);
                await new Promise(r => setTimeout(r, 3000));

                // Collect new internal links before modifying the DOM
                const links = await collectLinks(page);
                for (const link of links) {
                  const clean = link.split('?')[0].split('#')[0];
                  if (!visited.has(clean)) queue.push(clean);
                }

                await inlineAssets(page);
                await rewriteLinks(page, url);

                let html = await page.content();

                // Inject AdSense
                const adsTag = '<script async src=\"https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9638774372490271\" crossorigin=\"anonymous\"><\/script>';
                html = html.replace('</head>', adsTag + '\n</head>');

                const filePath = urlToFilePath(url);
                ensureDir(filePath);
                fs.writeFileSync(filePath, html);
                console.log('Saved:', filePath, '(' + html.length + ' bytes)');

              } catch(e) {
                console.error('Failed to process', url, e.message);
              } finally {
                await page.close();
              }
            }

            // Create a root index.html that redirects to /cps/
            fs.writeFileSync('index.html',
              '<!DOCTYPE html><html><head><meta http-equiv=\"refresh\" content=\"0;url=cps/\"><title>Redirecting...</title></head>' +
              '<body><p>Redirecting to <a href=\"cps/\">cps/</a>...</p></body></html>'
            );

            console.log('Done. Pages mirrored:', visited.size);
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Verify output
        run: |
          COUNT=$(find ./cps -name '*.html' | wc -l)
          echo "HTML files mirrored: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No files were mirrored"
            exit 1
          fi
          echo "OK"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html cps/
          git diff --cached --quiet || git commit -m "Mirror update $(date -u '+%Y-%m-%d %H:%M') - $COUNT pages"
          git push
