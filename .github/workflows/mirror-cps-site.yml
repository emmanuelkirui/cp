name: Mirror CPS Site

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install puppeteer

      - name: Get current runner IP
        id: runner_ip
        run: echo "ip=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Update .htaccess to allow only this runner IP
        run: |
          RUNNER_IP="${{ steps.runner_ip.outputs.ip }}"
          echo "Runner IP: $RUNNER_IP"

          cat > cps/.htaccess << EOF
          Options +Indexes

          # Block everyone by default
          Order Deny,Allow
          Deny from all

          # Allow only the current GitHub Actions runner
          Allow from $RUNNER_IP
          EOF

          echo ".htaccess written:"
          cat cps/.htaccess

      - name: Crawl and mirror /cps/ directory
        run: |
          node << 'EOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const path = require('path');

          const BASE = 'https://creativepulse.42web.io/cps/';
          const OUT  = path.resolve('./cps');
          const visited = new Set();
          const queue   = [BASE];

          function urlToFilePath(urlStr) {
            let rel = urlStr.replace(BASE, '');
            rel = rel.split('?')[0].split('#')[0];
            if (!rel || rel.endsWith('/')) rel += 'index.html';
            if (!path.extname(rel)) rel += '.html';
            return path.join(OUT, rel);
          }

          async function inlineCSS(page) {
            await page.evaluate(async () => {
              const links = [...document.querySelectorAll('link[rel="stylesheet"]')];
              for (const link of links) {
                try {
                  const r = await fetch(link.href, { mode: 'cors' });
                  if (!r.ok) continue;
                  let css = await r.text();
                  const fontUrls = [...css.matchAll(/url\(['"]?(https?:\/\/[^'")\s]+\.woff2[^'")\s]*)['"']?\)/g)].map(m => m[1]);
                  for (const fu of fontUrls) {
                    try {
                      const fr = await fetch(fu);
                      const b64 = btoa(String.fromCharCode(...new Uint8Array(await fr.arrayBuffer())));
                      css = css.replace(fu, 'data:font/woff2;base64,' + b64);
                    } catch(_) {}
                  }
                  const s = document.createElement('style');
                  s.textContent = css;
                  link.replaceWith(s);
                } catch(e) {
                  console.warn('CSS inline failed:', link.href, e.message);
                }
              }
            });
          }

          async function rewriteRelativeURLs(page) {
            await page.evaluate(() => {
              const base = 'https://creativepulse.42web.io/cps/';
              document.querySelectorAll('[src],[href],[action]').forEach(el => {
                ['src','href','action'].forEach(attr => {
                  const v = el.getAttribute(attr);
                  if (!v) return;
                  if (/^(https?:|\/\/|#|mailto:|tel:|data:|javascript:)/.test(v)) return;
                  el.setAttribute(attr, base + v);
                });
              });
            });
          }

          async function getInternalLinks(page) {
            return page.evaluate((base) => {
              return [...document.querySelectorAll('a[href]')]
                .map(a => a.href.split('#')[0].split('?')[0])
                .filter(h => h.startsWith(base));
            }, BASE);
          }

          (async () => {
            console.log('Starting crawl of', BASE);
            fs.mkdirSync(OUT, { recursive: true });

            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            while (queue.length > 0) {
              const url = queue.shift();
              if (visited.has(url)) continue;
              visited.add(url);
              console.log(`\n[${visited.size}] Visiting: ${url}`);

              const page = await browser.newPage();
              page.setDefaultNavigationTimeout(60000);
              await page.setViewport({ width: 1280, height: 800 });
              await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36');
              await page.setExtraHTTPHeaders({
                'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                'Accept-Language': 'en-US,en;q=0.9',
              });

              try {
                const response = await page.goto(url, { waitUntil: 'networkidle2' });
                const status = response ? response.status() : 'no-response';
                console.log('  Status:', status);

                if (status === 404 || status === 403) {
                  console.warn('  Skipping due to status', status);
                  await page.close();
                  continue;
                }

                await page.evaluate(() => document.fonts.ready);
                await new Promise(r => setTimeout(r, 3000));

                const links = await getInternalLinks(page);
                console.log('  Found links:', links.length);
                links.forEach(l => { if (!visited.has(l)) queue.push(l); });

                await inlineCSS(page);
                await rewriteRelativeURLs(page);

                let html = await page.content();
                html = html.replace('</head>',
                  '<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9638774372490271" crossorigin="anonymous"></script>\n</head>'
                );

                const filePath = urlToFilePath(url);
                fs.mkdirSync(path.dirname(filePath), { recursive: true });
                fs.writeFileSync(filePath, html, 'utf8');
                console.log('  Saved:', filePath, `(${html.length} bytes)`);

              } catch(e) {
                console.error('  ERROR on', url, '-', e.message);
              }

              await page.close();
            }

            await browser.close();

            fs.writeFileSync('index.html',
              '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=cps/index.html">' +
              '<title>Redirecting...</title></head><body><a href="cps/index.html">Enter site</a></body></html>'
            );

            console.log('\n=== Crawl complete. Pages visited:', visited.size, '===');
          })().catch(e => { console.error('Fatal:', e); process.exit(1); });
          EOF

      - name: Lock .htaccess — block all after crawl
        run: |
          mkdir -p cps
          cat > cps/.htaccess << 'EOF'
          Options +Indexes

          # Block all public access to directory listing
          Order Deny,Allow
          Deny from all
          EOF
          echo ".htaccess locked (all blocked)"

      - name: Verify output
        run: |
          echo "--- Directory listing ---"
          find ./cps -name '*.html' | head -50
          COUNT=$(find ./cps -name '*.html' | wc -l)
          echo "HTML files mirrored: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No files were mirrored"
            exit 1
          fi
          echo "OK: $COUNT pages mirrored"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html cps/
          git diff --cached --quiet && echo "No changes" || git commit -m "Mirror update $(date -u '+%Y-%m-%d %H:%M')"
          git push
