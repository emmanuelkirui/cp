name: Mirror All Sites

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Write mirror script
        run: |
          cat > mirror.js << 'EOF'
          const puppeteer = require('puppeteer');
          const fs   = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          const ORIGIN    = 'https://creativepulse.42web.io/cps/';
          const GH_DOMAIN = 'https://emmanuelkirui.github.io';
          const ADMIN_URL = ORIGIN + 'admin.php';
          const ADMIN_PASS = process.env.ADMIN_PASSWORD;
          const ADS_TAG   = '<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9638774372490271" crossorigin="anonymous"></script>';

          const PAGES = [
            { url: ORIGIN + 'port_kirui.php', output: 'index.html' },
            { url: ORIGIN,                    output: 'home.html'  },
          ];

          const URL_MAP = {
            [ORIGIN + 'port_kirui.php']: GH_DOMAIN + '/index.html',
            [ORIGIN + 'liv.php']:        GH_DOMAIN + '/liv.html',
            [ORIGIN + 'valmanu.php']:    GH_DOMAIN + '/valmanu.html',
            [ORIGIN]:                    GH_DOMAIN + '/home.html',
            // Admin link stays on GitHub Pages, not back to origin
            [ORIGIN + 'admin.php']:      GH_DOMAIN + '/admin.html',
          };

          // ── STEP 1: Login, download data.json + all uploads ─────────────────
          async function syncUploads(browser) {
            console.log('\n=== Syncing uploads via admin panel ===');
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 900 });
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36');

            // Navigate to admin
            console.log('Opening admin login...');
            await page.goto(ADMIN_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await new Promise(r => setTimeout(r, 2000));

            // Type password into the first password input
            const pwSelector = 'input[type="password"]';
            await page.waitForSelector(pwSelector, { timeout: 10000 });
            await page.click(pwSelector);
            await page.type(pwSelector, ADMIN_PASS, { delay: 60 });

            // Click the Sign In button
            await page.evaluate(() => {
              const btn = document.querySelector('button[type="submit"]') ||
                          document.querySelector('button');
              if (btn) btn.click();
            });

            await new Promise(r => setTimeout(r, 4000));
            console.log('After login, URL:', page.url());

            // Get session cookies for authenticated curl downloads
            const cookies = await page.cookies();
            const cookieStr = cookies.map(c => `${c.name}=${c.value}`).join('; ');

            // ── Download data.json ────────────────────────────────────────────
            console.log('\n--- Downloading data.json ---');
            const dataJsonUrl = ORIGIN + 'data.json';
            try {
              execSync(
                `curl -sL --max-time 30 --cookie "${cookieStr}" -o "data.json" "${dataJsonUrl}"`,
                { timeout: 35000 }
              );
              const size = fs.existsSync('data.json') ? fs.statSync('data.json').size : 0;
              if (size < 10) {
                console.warn('data.json too small or missing, removing.');
                if (fs.existsSync('data.json')) fs.unlinkSync('data.json');
              } else {
                console.log(`data.json downloaded (${(size/1024).toFixed(1)} KB)`);
                try {
                  JSON.parse(fs.readFileSync('data.json', 'utf8'));
                  console.log('data.json is valid JSON.');
                } catch(jsonErr) {
                  console.warn('data.json is not valid JSON, removing.');
                  fs.unlinkSync('data.json');
                }
              }
            } catch(e) {
              console.warn(`Failed to download data.json: ${e.message}`);
            }

            // ── Scrape upload file links ──────────────────────────────────────
            const fileLinks = await page.evaluate((origin) => {
              return Array.from(document.querySelectorAll('a[href]'))
                .map(a => {
                  const href = a.getAttribute('href');
                  if (!href) return null;
                  if (href.startsWith('http')) return href.includes('uploads/') ? href : null;
                  if (href.includes('uploads/')) return origin + href.replace(/^\//, '');
                  return null;
                })
                .filter(Boolean);
            }, ORIGIN);

            console.log('Found', fileLinks.length, 'upload file(s) via links:', fileLinks);

            // Also scan for data-pdf attributes
            const dataPdfs = await page.evaluate((origin) => {
              return Array.from(document.querySelectorAll('[data-pdf]'))
                .map(el => {
                  const v = el.getAttribute('data-pdf');
                  if (!v) return null;
                  return v.startsWith('http') ? v : origin + v.replace(/^\//, '');
                })
                .filter(Boolean);
            }, ORIGIN);

            // Also extract upload paths from data.json
            let dataJsonFiles = [];
            if (fs.existsSync('data.json')) {
              try {
                const d = JSON.parse(fs.readFileSync('data.json', 'utf8'));
                function extractPaths(obj) {
                  if (!obj) return;
                  if (typeof obj === 'string') {
                    if (obj.includes('uploads/')) dataJsonFiles.push(obj);
                  } else if (Array.isArray(obj)) {
                    obj.forEach(extractPaths);
                  } else if (typeof obj === 'object') {
                    Object.values(obj).forEach(extractPaths);
                  }
                }
                extractPaths(d);
                dataJsonFiles = dataJsonFiles.map(v =>
                  v.startsWith('http') ? v : ORIGIN + v.replace(/^\//, '')
                );
                console.log('Found', dataJsonFiles.length, 'upload path(s) in data.json');
              } catch(e) {
                console.warn('Could not parse data.json for paths:', e.message);
              }
            }

            const allFiles = [...new Set([...fileLinks, ...dataPdfs, ...dataJsonFiles])];
            console.log('Total unique files to download:', allFiles.length);

            if (!fs.existsSync('uploads')) fs.mkdirSync('uploads');

            for (const fileUrl of allFiles) {
              const filename = path.basename(fileUrl.split('?')[0]);
              const dest = `uploads/${filename}`;
              try {
                execSync(
                  `curl -sL --max-time 30 --cookie "${cookieStr}" -o "${dest}" "${fileUrl}"`,
                  { timeout: 35000 }
                );
                const size = fs.existsSync(dest) ? fs.statSync(dest).size : 0;
                if (size < 500) {
                  console.warn(`SKIP (too small ${size}B): ${filename}`);
                  if (fs.existsSync(dest)) fs.unlinkSync(dest);
                } else {
                  console.log(`Downloaded: ${filename} (${(size/1024).toFixed(1)} KB)`);
                }
              } catch(e) {
                console.warn(`Failed: ${fileUrl} — ${e.message}`);
              }
            }

            await page.close();
            console.log('=== Uploads sync done ===\n');
          }

          // ── STEP 2: Mirror a page ────────────────────────────────────────────
          async function mirrorPage(browser, url, output) {
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 800 });
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36');
            await page.setExtraHTTPHeaders({
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
              'Accept-Language': 'en-US,en;q=0.9',
              'Cache-Control': 'no-cache',
            });

            console.log('Navigating to', url, '...');
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.evaluate(() => document.fonts.ready);
            await new Promise(r => setTimeout(r, 6000));

            // Inline external CSS + woff2 fonts as base64
            await page.evaluate(async () => {
              const links = Array.from(document.querySelectorAll('link[rel="stylesheet"]'));
              for (const link of links) {
                try {
                  const resp = await fetch(link.href, { mode: 'cors' });
                  if (!resp.ok) throw new Error('HTTP ' + resp.status);
                  let css = await resp.text();
                  const fontUrls = [...css.matchAll(/url\(['"]?(https?:\/\/[^'"')]+\.woff2[^'"')']*?)['"]?\)/g)].map(m => m[1]);
                  for (const fontUrl of fontUrls) {
                    try {
                      const fr = await fetch(fontUrl);
                      const buf = await fr.arrayBuffer();
                      const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
                      css = css.replace(fontUrl, 'data:font/woff2;base64,' + b64);
                    } catch(fe) { console.warn('Font skip:', fontUrl); }
                  }
                  const style = document.createElement('style');
                  style.textContent = css;
                  link.parentNode.replaceChild(style, link);
                } catch(e) { console.warn('CSS skip:', link.href, e.message); }
              }
            });

            // Rewrite paths, fix admin link, fix PDF data-attributes
            await page.evaluate((urlMap, origin, ghDomain) => {

              // 1. Rewrite data-pdf attributes → mirrored /uploads/ path
              document.querySelectorAll('[data-pdf]').forEach(el => {
                const v = el.getAttribute('data-pdf') || '';
                const match = v.match(/uploads\/([^?#]+)/);
                if (match) {
                  el.setAttribute('data-pdf', ghDomain + '/uploads/' + match[1]);
                } else if (v && !v.startsWith('http') && !v.startsWith('data:')) {
                  el.setAttribute('data-pdf', ghDomain + '/' + v.replace(/^\//, ''));
                }
              });

              // 2. Fix the Admin nav link — prevent redirect back to creativepulse.42web.io
              document.querySelectorAll('a.nav-admin, a[href*="admin.php"]').forEach(el => {
                el.setAttribute('href', ghDomain + '/admin.html');
                el.setAttribute('title', 'Admin panel');
              });

              // 3. Rewrite all href / src / action attributes
              document.querySelectorAll('[src],[href],[action]').forEach(el => {
                ['src','href','action'].forEach(attr => {
                  const val = el.getAttribute(attr);
                  if (!val) return;

                  // Explicit map (covers admin.php → admin.html among others)
                  if (urlMap[val]) { el.setAttribute(attr, urlMap[val]); return; }

                  // Uploads → mirrored path
                  const upMatch = val.match(/uploads\/([^?#]+)/);
                  if (upMatch) {
                    el.setAttribute(attr, ghDomain + '/uploads/' + upMatch[1]);
                    return;
                  }

                  // Relative paths → absolute on origin
                  if (!val.startsWith('http') && !val.startsWith('//') && !val.startsWith('#') &&
                      !val.startsWith('mailto:') && !val.startsWith('tel:') &&
                      !val.startsWith('data:') && !val.startsWith('javascript:')) {
                    el.setAttribute(attr, origin + val);
                  }
                });
              });

              // 4. Disable form actions that point back to origin PHP scripts
              document.querySelectorAll('form[action]').forEach(form => {
                const action = form.getAttribute('action') || '';
                if (action.includes(origin) || action.endsWith('.php')) {
                  form.setAttribute('action', '#');
                  form.setAttribute('onsubmit', 'return false;');
                }
              });

            }, URL_MAP, ORIGIN, GH_DOMAIN);

            let html = await page.content();
            html = html.replace('</head>', ADS_TAG + '\n</head>');
            console.log(output, 'size:', html.length, 'bytes');
            fs.writeFileSync(output, html);
            await page.close();
          }

          // ── MAIN ─────────────────────────────────────────────────────────────
          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            // Sync uploads + data.json first
            await syncUploads(browser);

            // Mirror pages with delay between each
            for (let i = 0; i < PAGES.length; i++) {
              if (i > 0) {
                console.log('Waiting 15s before next page...');
                await new Promise(r => setTimeout(r, 15000));
              }
              let attempts = 0;
              while (attempts < 3) {
                try {
                  await mirrorPage(browser, PAGES[i].url, PAGES[i].output);
                  break;
                } catch(e) {
                  attempts++;
                  console.warn(`Attempt ${attempts} failed for ${PAGES[i].url}:`, e.message);
                  if (attempts < 3) {
                    console.log('Retrying in 20s...');
                    await new Promise(r => setTimeout(r, 20000));
                  } else { throw e; }
                }
              }
            }

            await browser.close();
            console.log('\nAll done.');
          })().catch(e => { console.error(e); process.exit(1); });
          EOF

      - name: Run mirror script
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node mirror.js

      - name: Verify file sizes
        run: |
          for f in index.html home.html; do
            SIZE=$(wc -c < $f)
            echo "$f size: $SIZE bytes"
            if [ "$SIZE" -lt 10000 ]; then
              echo "ERROR: $f too small"
              cat $f
              exit 1
            fi
          done
          echo "All HTML files OK"
          echo "Uploads folder:"
          ls -lh uploads/ 2>/dev/null || echo "(no uploads yet)"
          echo "data.json:"
          ls -lh data.json 2>/dev/null || echo "(data.json not committed)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html home.html uploads/ || true
          git add data.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Mirror update $(date -u '+%Y-%m-%d %H:%M')"
          git push
