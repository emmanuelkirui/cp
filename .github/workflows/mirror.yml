name: Mirror All Sites

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Write mirror script
        run: |
          cat > mirror.js << 'EOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const path = require('path');
          const https = require('https');
          const http = require('http');

          const ORIGIN    = 'https://creativepulse.42web.io/cps/';
          const GH_DOMAIN = 'https://emmanuelkirui.github.io';
          const ADMIN_URL = ORIGIN + 'admin.php';
          const ADMIN_PASS = process.env.ADMIN_PASSWORD;
          const ADS_TAG   = '<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9638774372490271" crossorigin="anonymous"></script>';

          const PAGES = [
            { url: ORIGIN + 'port_kirui.php', output: 'index.html' },
            { url: ORIGIN,                    output: 'home.html'  },
          ];

          const URL_MAP = {
            [ORIGIN + 'port_kirui.php']: GH_DOMAIN + '/index.html',
            [ORIGIN + 'liv.php']:        GH_DOMAIN + '/liv.html',
            [ORIGIN + 'valmanu.php']:    GH_DOMAIN + '/valmanu.html',
            [ORIGIN]:                    GH_DOMAIN + '/home.html',
          };

          // Download a file from URL to local path
          function downloadFile(url, dest) {
            return new Promise((resolve, reject) => {
              const proto = url.startsWith('https') ? https : http;
              const file = fs.createWriteStream(dest);
              proto.get(url, (res) => {
                if (res.statusCode === 301 || res.statusCode === 302) {
                  file.close();
                  fs.unlinkSync(dest);
                  return downloadFile(res.headers.location, dest).then(resolve).catch(reject);
                }
                if (res.statusCode !== 200) {
                  file.close();
                  fs.unlinkSync(dest);
                  return reject(new Error('HTTP ' + res.statusCode + ' for ' + url));
                }
                res.pipe(file);
                file.on('finish', () => { file.close(); resolve(); });
              }).on('error', (e) => {
                fs.unlink(dest, () => {});
                reject(e);
              });
            });
          }

          async function syncUploads(browser) {
            console.log('--- Syncing uploads via admin panel ---');
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 800 });
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36');

            // Go to admin login
            await page.goto(ADMIN_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await new Promise(r => setTimeout(r, 2000));

            // Fill password and submit
            await page.evaluate((pass) => {
              const inputs = document.querySelectorAll('input[type="password"], input[placeholder*="password" i], input[placeholder*="Password" i]');
              if (inputs.length > 0) inputs[0].value = pass;
            }, ADMIN_PASS);

            await page.evaluate(() => {
              const btns = document.querySelectorAll('button[type="submit"], input[type="submit"], button');
              if (btns.length > 0) btns[0].click();
            });

            await new Promise(r => setTimeout(r, 3000));
            console.log('Logged in, current URL:', page.url());

            // Scrape all file links from the admin file list
            const files = await page.evaluate((origin) => {
              const links = Array.from(document.querySelectorAll('a[href]'));
              return links
                .map(a => a.getAttribute('href'))
                .filter(href =>
                  href &&
                  (href.includes('uploads/') || href.includes('.pdf') || href.includes('.PDF') ||
                   href.match(/\.(jpg|jpeg|png|gif|webp|pdf|PDF)$/i))
                )
                .map(href => href.startsWith('http') ? href : origin + href.replace(/^\//, ''));
            }, ORIGIN);

            console.log('Found', files.length, 'files in admin panel:', files);

            // Create uploads directory
            if (!fs.existsSync('uploads')) fs.mkdirSync('uploads');

            // Get cookies for authenticated downloads
            const cookies = await page.cookies();
            const cookieStr = cookies.map(c => c.name + '=' + c.value).join('; ');

            for (const fileUrl of files) {
              const filename = path.basename(fileUrl.split('?')[0]);
              const dest = 'uploads/' + filename;
              try {
                // Use curl with session cookies for authenticated download
                const { execSync } = require('child_process');
                execSync(`curl -sL --cookie "${cookieStr}" -o "${dest}" "${fileUrl}"`, { timeout: 30000 });
                const size = fs.statSync(dest).size;
                if (size < 100) {
                  console.warn('File too small, skipping:', filename, size, 'bytes');
                  fs.unlinkSync(dest);
                } else {
                  console.log('Downloaded:', filename, '(' + size + ' bytes)');
                }
              } catch(e) {
                console.warn('Failed to download:', fileUrl, e.message);
              }
            }

            await page.close();
            console.log('--- Uploads sync done ---');
          }

          async function mirrorPage(browser, url, output) {
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 800 });
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36');
            await page.setExtraHTTPHeaders({
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
              'Accept-Language': 'en-US,en;q=0.9',
              'Cache-Control': 'no-cache',
            });

            console.log('Navigating to', url, '...');
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.evaluate(() => document.fonts.ready);
            await new Promise(r => setTimeout(r, 6000));

            // Inline ALL external CSS + woff2 fonts as base64
            await page.evaluate(async () => {
              const links = Array.from(document.querySelectorAll('link[rel="stylesheet"]'));
              for (const link of links) {
                try {
                  const resp = await fetch(link.href, { mode: 'cors' });
                  if (!resp.ok) throw new Error('HTTP ' + resp.status);
                  let css = await resp.text();
                  const fontUrls = [...css.matchAll(/url\(['"']?(https?:\/\/[^'"')]+\.woff2[^'"')]*)['"']?\)/g)].map(m => m[1]);
                  for (const fontUrl of fontUrls) {
                    try {
                      const fr = await fetch(fontUrl);
                      const buf = await fr.arrayBuffer();
                      const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
                      css = css.replace(fontUrl, 'data:font/woff2;base64,' + b64);
                    } catch(fe) { console.warn('Could not inline font:', fontUrl); }
                  }
                  const style = document.createElement('style');
                  style.textContent = css;
                  link.parentNode.replaceChild(style, link);
                  console.log('Inlined:', link.href);
                } catch(e) { console.warn('Could not inline stylesheet:', link.href, e.message); }
              }
            });

            // Rewrite uploads/ links to point to GitHub Pages
            // Rewrite internal page links + fix relative URLs
            await page.evaluate((urlMap, origin, ghDomain) => {
              document.querySelectorAll('[src],[href],[action]').forEach(el => {
                ['src','href','action'].forEach(attr => {
                  const val = el.getAttribute(attr);
                  if (!val) return;
                  // Known internal pages -> GitHub Pages
                  if (urlMap[val]) { el.setAttribute(attr, urlMap[val]); return; }
                  // uploads/ files -> GitHub Pages uploads/
                  if (val.includes('uploads/')) {
                    const filename = val.split('uploads/')[1].split('?')[0];
                    el.setAttribute(attr, ghDomain + '/uploads/' + filename);
                    return;
                  }
                  // Fix relative URLs
                  if (!val.startsWith('http') && !val.startsWith('//') && !val.startsWith('#') && !val.startsWith('mailto:') && !val.startsWith('tel:') && !val.startsWith('data:') && !val.startsWith('javascript:')) {
                    el.setAttribute(attr, origin + val);
                  }
                });
              });
            }, URL_MAP, ORIGIN, GH_DOMAIN);

            let html = await page.content();
            html = html.replace('</head>', ADS_TAG + '\n</head>');

            console.log(output, 'size:', html.length, 'bytes');
            fs.writeFileSync(output, html);
            await page.close();
          }

          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            // Step 1: Sync uploads from admin panel
            await syncUploads(browser);

            // Step 2: Mirror pages with 15s delay between each
            for (let i = 0; i < PAGES.length; i++) {
              if (i > 0) {
                console.log('Waiting 15s before next page...');
                await new Promise(r => setTimeout(r, 15000));
              }
              let attempts = 0;
              while (attempts < 3) {
                try {
                  await mirrorPage(browser, PAGES[i].url, PAGES[i].output);
                  break;
                } catch(e) {
                  attempts++;
                  console.warn('Attempt', attempts, 'failed for', PAGES[i].url, e.message);
                  if (attempts < 3) {
                    console.log('Retrying in 20s...');
                    await new Promise(r => setTimeout(r, 20000));
                  } else { throw e; }
                }
              }
            }

            await browser.close();
            console.log('All done.');
          })().catch(e => { console.error(e); process.exit(1); });
          EOF

      - name: Run mirror script
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node mirror.js

      - name: Verify file sizes
        run: |
          for f in index.html home.html; do
            SIZE=$(wc -c < $f)
            echo "$f size: $SIZE bytes"
            if [ "$SIZE" -lt 10000 ]; then
              echo "ERROR: $f too small, fetch likely failed"
              cat $f
              exit 1
            fi
          done
          echo "All files OK"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html home.html uploads/
          git diff --cached --quiet || git commit -m "Mirror update $(date -u '+%Y-%m-%d %H:%M')"
          git push
