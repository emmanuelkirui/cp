name: Mirror All Sites

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Ensure uploads folder exists
        run: mkdir -p uploads && touch uploads/.gitkeep

      - name: Write mirror script
        run: |
          cat > mirror.js << 'EOF'
          const puppeteer = require('puppeteer');
          const fs   = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          const ORIGIN    = 'https://creativepulse.42web.io/cps/';
          const GH_DOMAIN = 'https://emmanuelkirui.github.io';
          const ADMIN_URL = ORIGIN + 'admin.php';
          const ADMIN_PASS = process.env.ADMIN_PASSWORD;
          const ADS_TAG   = '<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9638774372490271" crossorigin="anonymous"></script>';

          const PAGES = [
            { url: ORIGIN + 'port_kirui.php', output: 'index.html' },
            { url: ORIGIN,                    output: 'home.html'  },
          ];

          const URL_MAP = {
            [ORIGIN + 'port_kirui.php']: GH_DOMAIN + '/index.html',
            [ORIGIN + 'liv.php']:        GH_DOMAIN + '/liv.html',
            [ORIGIN + 'valmanu.php']:    GH_DOMAIN + '/valmanu.html',
            [ORIGIN]:                    GH_DOMAIN + '/home.html',
          };

          // ── STEP 1: Login and download all uploads ──────────────────────────
          async function syncUploads(browser) {
            console.log('\n=== Syncing uploads via admin panel ===');
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 900 });
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36');

            // Step A: Login to admin
            console.log('Opening admin login...');
            await page.goto(ADMIN_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await new Promise(r => setTimeout(r, 2000));
            const pwSelector = 'input[type="password"]';
            await page.waitForSelector(pwSelector, { timeout: 10000 });
            await page.click(pwSelector);
            await page.type(pwSelector, ADMIN_PASS, { delay: 60 });
            await page.evaluate(() => {
              const btn = document.querySelector('button[type="submit"]') ||
                          document.querySelector('button');
              if (btn) btn.click();
            });
            await new Promise(r => setTimeout(r, 4000));
            console.log('After login, URL:', page.url());

            // Step B: Get session cookies then fetch data.json — source of truth
            const cookies = await page.cookies();
            const cookieStr = cookies.map(c => c.name + '=' + c.value).join('; ');

            let allFiles = [];
            try {
              const dataJsonUrl = ORIGIN + 'data.json';
              console.log('Fetching', dataJsonUrl);
              const result = execSync(
                'curl -sL --max-time 30 --cookie "' + cookieStr + '" "' + dataJsonUrl + '"',
                { timeout: 35000 }
              ).toString();
              const data = JSON.parse(result);
              // Recursively extract every string that contains uploads/
              const extract = (obj) => {
                if (!obj) return;
                if (typeof obj === 'string') { if (obj.includes('uploads/')) allFiles.push(obj); }
                else if (Array.isArray(obj)) obj.forEach(extract);
                else if (typeof obj === 'object') Object.values(obj).forEach(extract);
              };
              extract(data);
              allFiles = [...new Set(allFiles)].map(f =>
                f.startsWith('http') ? f : ORIGIN + f.replace(/^\//, '')
              );
              console.log('Files from data.json:', allFiles.length, allFiles);
            } catch(e) {
              console.warn('data.json failed, falling back to page scrape:', e.message);
              // Fallback: scrape page for upload links and data-pdf attrs
              allFiles = await page.evaluate((origin) => {
                const found = new Set();
                document.querySelectorAll('a[href],[data-pdf]').forEach(el => {
                  const v = el.getAttribute('href') || el.getAttribute('data-pdf') || '';
                  if (!v.includes('uploads/')) return;
                  found.add(v.startsWith('http') ? v : origin + v.replace(/^\//, ''));
                });
                return [...found];
              }, ORIGIN);
              console.log('Fallback files:', allFiles.length, allFiles);
            }

            // Step C: Download each file into uploads/
            if (!fs.existsSync('uploads')) fs.mkdirSync('uploads');

            for (const fileUrl of allFiles) {
              const filename = path.basename(fileUrl.split('?')[0]);
              const dest = 'uploads/' + filename;
              try {
                execSync(
                  'curl -sL --max-time 60 --cookie "' + cookieStr + '" -o "' + dest + '" "' + fileUrl + '"',
                  { timeout: 65000 }
                );
                const size = fs.existsSync(dest) ? fs.statSync(dest).size : 0;
                if (size < 500) {
                  console.warn('SKIP (too small ' + size + 'B): ' + filename);
                  if (fs.existsSync(dest)) fs.unlinkSync(dest);
                } else {
                  console.log('Downloaded: ' + filename + ' (' + (size/1024).toFixed(1) + ' KB)');
                }
              } catch(e) {
                console.warn('Failed: ' + fileUrl + ' — ' + e.message);
              }
              await new Promise(r => setTimeout(r, 2000));
            }

            await page.close();
            console.log('=== Uploads sync done ===\n');
          }
          // ── STEP 2: Mirror a page ────────────────────────────────────────────
          async function mirrorPage(browser, url, output) {
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 800 });
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36');
            await page.setExtraHTTPHeaders({
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
              'Accept-Language': 'en-US,en;q=0.9',
              'Cache-Control': 'no-cache',
            });

            console.log('Navigating to', url, '...');
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.evaluate(() => document.fonts.ready);
            await new Promise(r => setTimeout(r, 6000));

            // Inline external CSS + woff2 fonts as base64
            await page.evaluate(async () => {
              const links = Array.from(document.querySelectorAll('link[rel="stylesheet"]'));
              for (const link of links) {
                try {
                  const resp = await fetch(link.href, { mode: 'cors' });
                  if (!resp.ok) throw new Error('HTTP ' + resp.status);
                  let css = await resp.text();
                  const fontUrls = [...css.matchAll(/url\(['"]?(https?:\/\/[^'"')]+\.woff2[^'"')']*?)['"]?\)/g)].map(m => m[1]);
                  for (const fontUrl of fontUrls) {
                    try {
                      const fr = await fetch(fontUrl);
                      const buf = await fr.arrayBuffer();
                      const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
                      css = css.replace(fontUrl, 'data:font/woff2;base64,' + b64);
                    } catch(fe) { console.warn('Font skip:', fontUrl); }
                  }
                  const style = document.createElement('style');
                  style.textContent = css;
                  link.parentNode.replaceChild(style, link);
                } catch(e) { console.warn('CSS skip:', link.href, e.message); }
              }
            });

            // Rewrite uploads/ paths, swap PDF previews with PNG, fix internal links
            await page.evaluate((urlMap, origin, ghDomain) => {

              // 1. Rewrite data-pdf attributes -> point directly to 42web.io
              document.querySelectorAll('[data-pdf]').forEach(el => {
                const v = el.getAttribute('data-pdf') || '';
                if (!v) return;
                if (v.match(/^https?:\/\//)) return; // already absolute, leave it
                // Relative path like uploads/filename.pdf
                const clean = v.replace(/^\//, '');
                el.setAttribute('data-pdf', origin + clean);
              });

              // 3. Rewrite href/src/action
              document.querySelectorAll('[src],[href],[action]').forEach(el => {
                ['src','href','action'].forEach(attr => {
                  const val = el.getAttribute(attr);
                  if (!val) return;
                  if (urlMap[val]) { el.setAttribute(attr, urlMap[val]); return; }
                  if (val.includes('uploads/')) {
                    const fname = val.split('uploads/')[1].split('?')[0];
                    el.setAttribute(attr, ghDomain + '/uploads/' + fname);
                    return;
                  }
                  if (!val.startsWith('http') && !val.startsWith('//') && !val.startsWith('#') &&
                      !val.startsWith('mailto:') && !val.startsWith('tel:') &&
                      !val.startsWith('data:') && !val.startsWith('javascript:')) {
                    el.setAttribute(attr, origin + val);
                  }
                });
              });
            }, URL_MAP, ORIGIN, GH_DOMAIN);

            let html = await page.content();

            // Rewrite ALL pdf/upload references to absolute 42web.io URLs
            const PDF_BASE = 'https://creativepulse.42web.io/cps/';

            // 1. data-pdf — catch any remaining relative ones not caught in evaluate()
            html = html.replace(/data-pdf="(?!https?:\/\/)(uploads\/[^"]*)"/g,
              'data-pdf="' + PDF_BASE + '$1"');

            // 2. openPdfModal("uploads/...") — Full View button inline onclick
            html = html.replace(/openPdfModal\("(?!https?:\/\/)(uploads\/[^"]+)"/g,
              'openPdfModal("' + PDF_BASE + '$1"');

            // 3. openPdfModal('uploads/...') — single quote variant
            html = html.replace(/openPdfModal\('(?!https?:\/\/)(uploads\/[^']+)'/g,
              "openPdfModal('" + PDF_BASE + "$1'");

            // 4. href="uploads/..." — download links
            html = html.replace(/href="(?!https?:\/\/)(uploads\/[^"]*\.(pdf|PDF|png|jpg|jpeg))"/g,
              'href="' + PDF_BASE + '$1"');

            // 5. Fix any GitHub Pages upload URLs that slipped through — redirect to 42web.io
            html = html.replace(/https:\/\/emmanuelkirui\.github\.io\/uploads\//g,
              PDF_BASE + 'uploads/');

            // Override _absUrl() to resolve uploads/ against 42web.io
            // This is the guaranteed fix — no regex matching needed
            const FIX_SCRIPT = `<script>
// Fix: resolve uploads/ paths against 42web.io instead of GitHub Pages
var _UPLOADS_BASE = 'https://creativepulse.42web.io/cps/';
var _orig_absUrl = window._absUrl;
function _absUrl(src) {
  if (!src) return src;
  if (src.match(/^https?:\/\//)) return src;
  if (src.startsWith('uploads/') || src.indexOf('/uploads/') !== -1) {
    return _UPLOADS_BASE + src.replace(/^\//, '');
  }
  var a = document.createElement('a');
  a.href = src;
  return a.href;
}
<\/script>`;

            html = html.replace('</head>', FIX_SCRIPT + '\n' + ADS_TAG + '\n</head>');

            console.log(output, 'size:', html.length, 'bytes');
            fs.writeFileSync(output, html);
            await page.close();
          }

          // ── MAIN ─────────────────────────────────────────────────────────────
          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            // Sync uploads first
            await syncUploads(browser);

            // Mirror pages with delay between each
            for (let i = 0; i < PAGES.length; i++) {
              if (i > 0) {
                console.log('Waiting 15s before next page...');
                await new Promise(r => setTimeout(r, 15000));
              }
              let attempts = 0;
              while (attempts < 3) {
                try {
                  await mirrorPage(browser, PAGES[i].url, PAGES[i].output);
                  break;
                } catch(e) {
                  attempts++;
                  console.warn(`Attempt ${attempts} failed for ${PAGES[i].url}:`, e.message);
                  if (attempts < 3) {
                    console.log('Retrying in 20s...');
                    await new Promise(r => setTimeout(r, 20000));
                  } else { throw e; }
                }
              }
            }

            await browser.close();
            console.log('\nAll done.');
          })().catch(e => { console.error(e); process.exit(1); });
          EOF

      - name: Run mirror script
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node mirror.js

      - name: Verify file sizes
        run: |
          for f in index.html home.html; do
            SIZE=$(wc -c < $f)
            echo "$f size: $SIZE bytes"
            if [ "$SIZE" -lt 10000 ]; then
              echo "ERROR: $f too small"
              cat $f
              exit 1
            fi
          done
          echo "All HTML files OK"
          echo "Uploads folder:"
          ls -lh uploads/ 2>/dev/null || echo "(no uploads yet)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html home.html uploads/ uploads/.gitkeep
          git diff --cached --quiet || git commit -m "Mirror update $(date -u '+%Y-%m-%d %H:%M')"
          git push
